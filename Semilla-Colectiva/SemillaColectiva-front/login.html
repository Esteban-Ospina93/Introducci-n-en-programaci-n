<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <!-- Iconos -->
    <link rel="icon" type="image/png" href="./assets/icons/logo.png">
    <!-- Fuentes -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat+Alternates:wght@300;400;600;700;800&display=swap"
        rel="stylesheet">
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
    <!-- CSS -->
    <link rel="stylesheet" href="./css/styles-form.css">
</head>

<body>
    <section class="container">
        <div>
            <div class="card-login">
                <form class="formulario hidden">
                    <fieldset>
                        <legend>Login</legend>
                        <div class="mb-3">
                            <label for="text" class="form-label">Usuario</label>
                            <input type="text" class="form-control" placeholder="Correo">
                        </div>
                        <div class="mb-3">
                            <label for="password" class="form-label">Contraseña</label>
                            <input type="password" class="form-control" placeholder="Contraseña">
                        </div>
                        <div class="mb-3">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="disabledFieldsetCheck">
                                <label class="form-check-label" for="disabledFieldsetCheck">Recordar
                                    contraseña</label>
                            </div>
                        </div>
                        <div class="mb-3">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="checkboxOlvido" disabled>
                                <label class="form-check-label olvido-label" for="checkboxOlvido" data-bs-toggle="modal"
                                    data-bs-target="#modalRecuperar">
                                    ¿Olvidaste tu contraseña?
                                </label>
                            </div>
                        </div>
                        <button type="submit" class="btn my-button">Submit</button>
                    </fieldset>
                </form>
                <div class="image-container d-none d-md-block">
                    <img class="img" src="./assets/images/fondo-form.jpg" alt="Bosque con árboles">
                </div>
            </div>
        </div>
    </section>
    <!-- Modal de recuperación de contraseña -->
    <div class="modal fade" id="modalRecuperar" tabindex="-1" aria-labelledby="modalRecuperarLabel" aria-hidden="true">

        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content bg-light">
                <div class="modal-header">
                    <h5 class="modal-title" id="modalRecuperarLabel">Recuperar Contraseña</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                </div>
                <div class="modal-body">
                    <p>Ingresa tu correo electrónico y te enviaremos instrucciones para restablecer tu contraseña.</p>
                    <input type="email" class="form-control" id="correoRecuperar" placeholder="Tu correo electrónico">
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class=" btn btn-success" onclick="enviarRecuperacion()">Enviar</button>
                </div>
            </div>
        </div>
    </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-j1CDi7MgGQ12Z7Qab0qlWQ/Qqz24Gc6BM0thvEMVjHnfYGF0rmFCozFSxQBxwHKO"
        crossorigin="anonymous"></script>
    <script src="./js/login.js"></script>
</body>

</html>
