<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trazabilidad</title>
    <!-- Iconos -->
    <link rel="icon" type="image/png" href="./assets/icons/logo.png">
    <!-- Fuentes -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat+Alternates:wght@300;400;600;700;800&display=swap"
        rel="stylesheet">
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
    <!-- CSS -->
    <link rel="stylesheet" href="./css/styles.css">
    <link rel="stylesheet" href="./css/styles-trazabilidad.css">
</head>
<main>

    <body>
        <div class="background">
            <nav class="navbar sticky-top">
                <div class="container-fluid">
                    <a class="navbar-brand fs-1 fw-bolder title" href="#">Semilla Colectiva</a>
                    <button class="navbar-toggler" type="button" data-bs-toggle="offcanvas"
                        data-bs-target="#offcanvasNavbar" aria-controls="offcanvasNavbar"
                        aria-label="Toggle navigation">
                        <span class="navbar-toggler-icon"></span>
                    </button>
                    <div class="offcanvas offcanvas-end" tabindex="-1" id="offcanvasNavbar"
                        aria-labelledby="offcanvasNavbarLabel">
                        <div class="offcanvas-header">
                            <h5 class="offcanvas-title fw-semibold" id="offcanvasNavbarLabel">Menú</h5>
                            <button type="button" class="btn-close" data-bs-dismiss="offcanvas"
                                aria-label="Close"></button>
                        </div>
                        <div class="offcanvas-body">
                            <ul class="navbar-nav justify-content-end flex-grow-1 pe-3 fs-5 my-toogle-nav">
                                <li class="nav-item">
                                    <a class="nav-link active" id="text-color" aria-current="page"
                                        href="./index.html">Inicio</a>
                                </li>
                                <li class="nav-item">
                                    <a class="nav-link" id="text-color" href="#">Cuenta</a>
                                </li>
                            </ul>
                            <form class="d-flex mt-3" role="search">
                                <input class="form-control me-2" type="search" placeholder="Search"
                                    aria-label="Search" />
                                <button class="btn btn-outline-success" type="submit">Search</button>
                            </form>
                        </div>
                    </div>
                </div>

            </nav>
            <div class="navandtabs">
                <ul class="nav my-nav">
                    <li class="nav-item">
                        <a class="nav-link" href="#" data-bs-toggle="modal" data-bs-target="#trazabilidadModal">Crear
                            trazabilidad</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">Fotografías</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link activo" id="verHistorial" href="#">Historial</a>
                    </li>
                </ul>
            </div>
            <div class="container mt-4" id="historialContainer" style="display: none;">
                <h3 class="subtitle">Historial de Trazabilidad</h3>
                <div id="historialList" class="row row-cols-1 row-cols-md-3 g-4 text-white"></div>
            </div>
        </div>

        <!-- Tarjetas creadas depués del formulario -->
        <div class="modal fade" id="trazabilidadModal" aria-hidden="true">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title" id="trazabilidadModalLabel">Crear trazabilidad</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                    </div>
                    <div class="modal-body">
                        <form id="formTrazabilidad">
                            <div class="mb-3">
                                <label for="imagen" class="form-label">Imagen del árbol</label>
                                <div class="image-drop-box">
                                    <input type="file" id="imagen" accept="image/*" required>
                                    <span class="drop-text">Haz clic o arrastra una imagen</span>
                                </div>
                                <div id="previewContainer" class="image-preview-container">
                                    <img id="previewImage" class="image-preview" src="#" alt="Vista previa" />
                                </div>
                            </div>
                            <div class="mb-3">
                                <label for="nombre" class="form-label">Nombre</label>
                                <input type="text" class="form-control" id="nombre" required>
                            </div>
                            <div class="mb-3">
                                <label for="especie" class="form-label">Especie</label>
                                <input type="text" class="form-control" id="especie" required>
                            </div>
                            <div class="mb-3">
                                <label for="ciclo" class="form-label">Ciclo de vida</label>
                                <select id="ciclo" class="form-select" required>
                                    <option value="">Seleccione una opción</option>
                                    <option value="germinacion">Germinación</option>
                                    <option value="crecimiento">Crecimiento</option>
                                    <option value="madurez">Madurez</option>
                                    <option value="senescencia">Senescencia</option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label for="estado" class="form-label">Estado</label>
                                <select id="estado" class="form-select" required>
                                    <option value="">Seleccione una opción</option>
                                    <option value="saludable">Saludable</option>
                                    <option value="enfermo">Enfermo</option>
                                    <option value="riesgo">Riesgo</option>
                                    <option value="transplantado">Transplantado</option>
                                </select>
                            </div>
                            <button type="submit" id="btnEnviar" class="btn w-100" disabled>Enviar</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
        </div>
        <!-- Footer -->
        <footer class="text-center py-4 bg-dark text-white">
            <p>&copy; 2025 Semilla Colectiva. Todos los derechos reservados.</p>
        </footer>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-j1CDi7MgGQ12Z7Qab0qlWQ/Qqz24Gc6BM0thvEMVjHnfYGF0rmFCozFSxQBxwHKO"
    crossorigin="anonymous"></script>
<script src="./js/trazabilidad.js"></script>

</body>

</html>
